="brokerLeft"><span class="bubble">MT</span><div><strong>Master Trader Pro</strong><small>Sample Provider · signal service</small></div></div><label class="switch">Follow <input type="checkbox" ${state.copy?'checked':''} onchange="state.copy=this.checked;toast('Preview following preference updated')"/></label></div><div class="lineRow">Copy lot size <b>0.01 fixed</b></div><div class="lineRow">Market copy <span class="badge">OFF · DEMO ONLY</span></div><button class="btn" onclick="go('Copy Trading')">Copy Trading Settings →</button></section></div><section class="panel" style="margin-top:14px"><div class="row"><div><h2>Open Positions</h2><p class="sub">Sample trades · first two rows represent the two Telegram layers</p></div><button class="btn" onclick="go('Orders & Trades')">View All</button></div>${positionsTable()}</section><section class="panel" style="margin-top:14px"><div class="row"><div><h2>Smart Trade Controls</h2><p class="sub">Controls only change this local UI preview.</p></div></div><div class="row" style="gap:20px;flex-wrap:wrap"><label class="switch">Auto Break-Even <input type="checkbox" ${state.be?'checked':''} onchange="state.be=this.checked;toast('UI preview: Auto BE '+(state.be?'ON':'OFF'))"/></label><label class="switch">Emergency Lock <input type="checkbox" ${state.emergency?'checked':''} onchange="state.emergency=this.checked;toast('UI preview: Emergency Lock '+(state.emergency?'ON':'OFF'))"/></label><span class="mini">No real trading action</span></div></section>`}
function telegram(){return head('Telegram Signal Studio','Preview how Telegram BUY/SELL LIMIT signals plan 2 layers. No broker order is created.')+notice()+`<div class="grid2"><section class="panel"><h2>Gold Limit VIP — Signal Preview</h2><p class="sub">Telegram XAUUSD entry offset follows the saved owner rule.</p><div class="stack"><label class="field">Direction <select id="sigSide" onchange="state.signalSide=this.value;renderSignal()"><option ${state.signalSide==='BUY'?'selected':''}>BUY</option><option ${state.signalSide==='SELL'?'selected':''}>SELL</option></select></label><div class="formRow"><label class="field">Original entry <input type="number" step=".01" id="sigEntry" value="${esc(state.signalEntry)}" onchange="state.signalEntry=this.value;renderSignal()"></label><label class="field">Signal SL <input type="number" id="sigSL" step=".01" value="${esc(state.signalSL)}" onchange="state.signalSL=this.value;renderSignal()"></label></div><label class="field">Signal TP <input type="number" id="sigTP" step=".01" value="${esc(state.signalTP)}" onchange="state.signalTP=this.value;renderSignal()"></label><button class="btn primary" onclick="previewSignal()">Calculate 2-Layer Preview</button></div><div class="footNote">Original Telegram logic: Gold BUY +0.99; SELL −0.90; Layer1 TP 50 pips (example pip-size setting 0.10); Layer2 TP from signal.</div></section><section class="panel"><h2>Order Plan</h2><p class="sub">Price and lot values shown for UI demonstration</p><div id="signalOutput" class="highlight">Choose a side and click Preview to see two pending orders.</div><div class="separator"></div><div class="highlight">LIMIT → STOP fallback: only after a definite broker price/type rejection and broker preflight validation. This demo never submits an order.</div></section></div>`}

function previewSignal(){let s=state.signalSide,e=Number(state.signalEntry),sl=Number(state.signalSL),tp=Number(state.signalTP);if(![e,sl,tp].every(Number.isFinite)||e<=0||sl<=0||tp<=0){toast('Enter valid prices');return}const offset=s==='BUY'?.99:-.90;let a=e+offset;const d=s==='BUY'?1:-1;const tp1=a+d*5;const fmt=x=>x.toFixed(2);$('signalOutput').innerHTML=`<div class="lineRow"><b>Original Entry</b><b>${fmt(e)}</b></div><div class="lineRow"><b>Adjusted Entry</b><b class="cyan">${fmt(a)}</b></div><div class="lineRow"><b>Layer 1 · ${s} LIMIT</b><span>Entry ${fmt(a)} · SL ${fmt(sl)} · TP ${fmt(tp1)}</span></div><div class="lineRow"><b>Layer 2 · ${s} LIMIT</b><span>Entry ${fmt(a)} · SL ${fmt(sl)} · TP ${fmt(tp)}</span></div><p class="footNote">Demonstration of policy; not a broker validation or signal execution. Configure pips precisely per broker.</p>`;toast('Calculated locally — no trade submitted')}

function eqIsInPeriod(date,period){

function eqRiskHero(totalToday){const target=Number(eqRisk.target),loss=Number(eqRisk.loss),pnl=totalToday.pnl;const percent=Math.max(0,Math.min(100,100*Math.max(0,pnl)/target)),used=Math.max(0,Math.min(100,100*Math.max(0,-pnl)/loss));return `<section class="eq-protect"><div class="eq-subhead"><h3>Smart Profit & Risk</h3><span class="eq-updated">◎ Editable demo controls</span></div><div class="eq-grid2" style="margin:0"><div><span class="eq-muted">Today's realized P&L</span><div class="big ${pnl>=0?'green':'red'}">${eqFmtMoney(pnl)}</div><div class="eq-muted">Capital: ${eqMoney(eqRisk.capital)}</div></div><div><span class="eq-muted">Daily target</span><div class="big">${eqMoney(target)}</div><div class="eq-track"><span style="width:${percent}%"></span></div><div class="eq-muted">${percent.toFixed(0)}% of target · illustrative</div></div></div><div class="divider"></div><div class="row"><span class="eq-muted">Daily loss limit (display only)</span><b class="gold">${eqMoney(loss)}</b></div><div class="eq-track loss"><span style="width:${used}%"></span></div><div class="eq-muted">Loss utilization ${used.toFixed(0)}% · does not place or block orders</div><div class="eq-buttons" style="margin-top:11px"><button class="eq-btn" onclick="go('Smart Risk')">⚙ Edit targets & limits</button><button class="eq-btn alt" onclick="eqSuggestRisk(true)">✦ Suggest by capital</button></div></section>`}
function eqSignalCounts(period){const sig=eqFilteredSignals(period),limit=sig.filter(s=>s.type==='LIMIT');return {sig,limit,activated:limit.filter(s=>s.status==='TRIGGERED').length,pending:limit.filter(s=>s.status==='PENDING').length,notActive:limit.filter(s=>s.status==='NOT ACTIVATED').length,triggered:sig.filter(s=>s.status==='TRIGGERED').length}}
function eqTodaySignalPanel(){const x=eqSignalCounts('TODAY');return `<section class="panel"><div class="eq-subhead"><h2>Today's Signal & LIMIT Activity</h2><button class="eq-btn alt" onclick="go('Signal Feed')">All signals ↗</button></div><div class="eq-statsstrip"><div class="eq-strip"><small>Signals received</small><b class="cyan">${x.sig.length}</b></div><div class="eq-strip"><small>Trades triggered (signals)</small><b class="green">${x.triggered}</b></div><div class="eq-strip"><small>LIMIT triggered</small><b>${x.activated}/${x.limit.length}</b></div><div class="eq-strip"><small>LIMIT not activated</small><b class="red">${x.notActive}</b></div></div><div class="eq-row"><span>LIMIT orders · triggered layers</span><b class="green">${2*x.activated}</b></div><div class="eq-row"><span>LIMIT orders · currently pending</span><b class="gold">${2*x.pending}</b></div><div class="eq-row"><span>LIMIT orders · expired/not activated</span><b class="red">${2*x.notActive}</b></div><p class="eq-tagline">Signal and order-leg counts are shown separately. Each sample Telegram signal has 2 layers; no real broker data.</p></section>`}
function eqSmallLive(){return `<section class="panel"><div class="eq-subhead"><h2><span class="eq-live-dot"></span> Open Trades</h2><button class="eq-btn alt" onclick="go('Live Trades')">View live board ↗</button></div>${eqLiveTrades.map(t=>`<div class="eq-row"><div><div class="primarytext">${t.symbol} <span class="eq-chip">${t.side} ${t.layers}</span></div><small>${esc(t.channel)} · ${esc(t.broker)}</small></div><div style="text-align:right"><b class="${t.pnl>=0?'green':'red'}">${eqFmtMoney(t.pnl)}</b><small>Sample floating P&L</small></div></div>`).join('')}<div class="eq-row"><b>Floating P&L</b><strong class="green">${eqFmtMoney(eqLiveTrades.reduce((a,t)=>a+t.pnl,0))}</strong></div></section>`}
function eqBestPerformance(trades){const ranks=eqChannelsRank(trades),top=ranks[0],best=trades.reduce((a,t)=>!a||t.pnl>a.pnl?t:a,null);return `<section class="panel"><div class="eq-subhead"><h2>Top Performer · ${eqPeriod==='ALL'?'All Time':eqPeriod[0]+eqPeriod.slice(1).toLowerCase()}</h2><span class="eq-updated">✧ Auto-ranked</span></div><div class="eq-leader"><div class="icon">🏆</div><div style="min-width:0"><b>${top?esc(top.channel):'No trade history'}</b><span>Best signal channel by net P&L</span></div><b class="profit">${top?eqFmtMoney(top.pnl):'$0.00'}</b></div><div class="eq-leader"><div class="icon">✦</div><div style="min-width:0"><b>${best?`${best.symbol} ${best.side} · ${esc(best.id)}`:'No completed trades'}</b><span>Best single closed trade in selected period</span></div><b class="profit">${best?eqFmtMoney(best.pnl):'$0.00'}</b></div><div class="divider"></div><h2 style="margin:11px 0">Channel Ranking</h2>${eqChannelLeaders(trades)}</section>`}
function eqOverview(){const trades=eqFilteredTrades(eqPeriod),sum=eqSummary(trades),x=eqSignalCounts(eqPeriod),todaySum=eqSummary(eqFilteredTrades('TODAY'));return `<div class="eq-hero"><div><span class="eq-section-tag">✧ EDGEQUANT SENTINEL PRO · RECEIVER</span><h1>Trading intelligence, beautifully clear.</h1><p>Smart execution overview, trading analytics and disciplined risk controls — all in one premium workspace.</p><div style="margin-top:19px">${eqPeriodButtons()}</div></div><div class="eq-hero-stat"><small>REALIZED P&L · ${eqPeriod}</small><strong class="${sum.pnl>=0?'green':'red'}">${eqFmtMoney(sum.pnl)}</strong><div class="minis">${sum.total} closed trade legs · ${sum.total?Math.round(100*sum.wins/sum.total):0}% positive P&L</div><div style="margin-top:15px">${chart()}</div></div></div>${notice()}<div class="eq-grid4">${eqKpi('Signals Received',x.sig.length,'Telegram signal messages','', '✉')}${eqKpi('Trade Legs Closed',sum.total,'Completed journal records','green','↗')}${eqKpi('Pending Orders',eqPendingOrders.length,'LIMIT pending legs','gold','⌛')}${eqKpi('Running Trades',eqLiveTrades.length,eqFmtMoney(eqLiveTrades.reduce((a,t)=>a+t.pnl,0))+' floating','', '●')}${eqKpi('Take Profit Hits',sum.tp,'Closed at TP','green','◎')}${eqKpi('Stop Loss Hits',sum.sl,'Closed at SL','red','◇')}${eqKpi('Break-Even Closes',sum.be,'Closed at BE','', '⊜')}${eqKpi('Manual Closes',sum.manual,'User-initiated exits','gold','✋')}</div><div class="eq-grid2"><div>${eqRiskHero(todaySum)}</div><div>${eqBestPerformance(trades)}</div></div><div class="eq-grid2"><div>${eqTodaySignalPanel()}</div><div>${eqSmallLive()}</div></div><div class="eq-grid2"><section class="panel"><div class="eq-subhead"><h2>Profit Calendar</h2><button class="eq-btn alt" onclick="go('Profit Calendar')">Open calendar ↗</button></div>${eqCalendarMini()}</section><section class="panel"><div class="eq-subhead"><h2>Professional Trade Journal</h2><button class="eq-btn primary" onclick="go('Trade Journal')">Open Journal ↗</button></div><p class="eq-muted">Inspect trade histories, document execution reasons, filter performance by provider, then generate Excel/PDF reports.</p><div class="eq-row"><span>Today journal records</span><b>${todaySum.total}</b></div><div class="eq-row"><span>Today TP / SL / BE / Manual</span><b>${todaySum.tp} / ${todaySum.sl} / ${todaySum.be} / ${todaySum.manual}</b></div><div class="eq-buttons" style="margin-top:14px"><button class="eq-btn" onclick="eqExportXlsx()">↓ Excel Report</button><button class="eq-btn" onclick="eqExportPdf()">↓ PDF Report</button></div><p class="eq-tagline" style="margin-top:13px">Exports use the Trade Journal's current filters. Demo ledger only.</p></section></div>`}
function eqPending(){const x=eqSignalCounts('TODAY');return head('Pending Orders','Monitor unfilled LIMIT legs, trigger progress and expired entries — simulated data only.')+notice()+`<div class="eq-grid4">${eqKpi('Still Pending',eqPendingOrders.length,'2 signal entries · 2 layers each','gold','⌛')}${eqKpi('LIMIT Triggered',2*x.activated,'Activated order legs','green','↗')}${eqKpi('Not Activated',2*x.notActive,'Expired / unfilled legs','red','○')}${eqKpi('Active Pending Signals',x.pending,'2 separate signals','', '◆')}</div><section class="panel"><div class="eq-subhead"><h2>Pending MT5 Orders</h2><span class="eq-updated">Sample orders only</span></div><div class="eq-table-scroll"><table class="eq-table"><thead><tr><th>Ticket</th><th>Symbol</th><th>Side / Layer</th><th>Type</th><th>Entry</th><th>SL</th><th>TP</th><th>Lot</th><th>Channel</th><th>Broker</th><th>Status</th></tr></thead><tbody>${eqPendingOrders.map(o=>`<tr><td>#${o.ticket}</td><td><b>${o.symbol}</b></td><td><span class="eq-chip">${o.side} ${o.layer}</span></td><td>${o.type}</td><td>${o.entry}</td><td>${o.sl}</td><td>${o.tp}</td><td>${o.lot}</td><td>${esc(o.channel)}</td><td>${esc(o.broker)}</td><td><span class="eq-chip pending">${o.status}</span></td></tr>`).join('')}</tbody></table></div><p class="eq-tagline">No actual pending orders are monitored, created, or cancelled from this demo.</p></section>${eqTodaySignalPanel()}`}
function eqLive(){const todaySum=eqSummary(eqFilteredTrades('TODAY'));return head('Running Trades','Inspect floating P&L, SL, TP, broker and active copy layers in one place.')+notice()+`<div class="eq-grid4">${eqKpi('Open Positions',eqLiveTrades.length,'Sample running positions','green','●')}${eqKpi('Floating P&L',eqFmtMoney(eqLiveTrades.reduce((a,t)=>a+t.pnl,0)),'Illustrative P&L','green','↗')}${eqKpi('Today Closed',todaySum.total,'Journal trade legs','', '▤')}${eqKpi('Today Manual Closes',todaySum.manual,'User closed positions','gold','✋')}</div><section class="panel"><div class="eq-subhead"><h2><span class="eq-live-dot"></span> Running Trades</h2><span class="eq-updated">Static quote preview · not streaming</span></div><div class="eq-table-scroll"><table class="eq-table"><thead><tr><th>Ticket</th><th>Symbol</th><th>Side / Layer</th><th>Lot</th><th>Entry</th><th>Sample Price</th><th>SL</th><th>TP</th><th>BE</th><th>Floating P&L</th><th>Channel / Broker</th></tr></thead><tbody>${eqLiveTrades.map(o=>`<tr><td>#${o.ticket}</td><td>${o.symbol}</td><td><span class="eq-chip">${o.side} ${o.layers}</span></td><td>${o.lot}</td><td>${o.entry}</td><td>${o.price}</td><td>${o.sl}</td><td>${o.tp}</td><td>${o.be}</td><td class="green">${eqFmtMoney(o.pnl)}</td><td>${esc(o.channel)}<br><small class="eq-muted">${esc(o.broker)}</small></td></tr>`).join('')}</tbody></table></div></section><div class="eq-grid2"><section class="panel"><h2>Closed Today by Exit Reason</h2>${[['TP',todaySum.tp,'green'],['SL',todaySum.sl,'red'],['BE',todaySum.be,'cyan'],['Manual Close',todaySum.manual,'gold']].map(r=>`<div class="eq-row">${r[0]} <b class="${r[2]}">${r[1]}</b></div>`).join('')}</section><section class="panel"><h2>Trade Management Safety</h2><p class="eq-muted">This UI does not issue CLOSE, MODIFY, BREAK EVEN or other broker commands. Real actions require a verified account-scoped MT5 worker and server-enforced risk controls.</p><button class="eq-btn" onclick="go('Smart Risk')">View risk configuration</button></section></div>`}
function eqFeed(){const s=eqSignals.filter(r=>r.date===eqToday),x=eqSignalCounts('TODAY');return head('Telegram Signal Feed','Receiver view only — no Signal Studio, no signal publishing permissions.')+notice()+`<div class="eq-grid4">${eqKpi('Signals Today',s.length,'Received messages','', '✉')}${eqKpi('LIMIT Triggered',x.activated,'Triggered entries','green','↗')}${eqKpi('LIMIT Pending',x.pending,'Unfilled signals','gold','⌛')}${eqKpi('Not Activated',x.notActive,'Expired signals','red','○')}</div><section class="panel"><div class="eq-subhead"><h2>Signal Activity</h2><span class="eq-updated">Receiver · read only</span></div><div class="eq-table-scroll"><table class="eq-table"><thead><tr><th>Signal ID</th><th>Time</th><th>Channel / Group</th><th>Symbol</th><th>Side</th><th>Entry Type</th><th>Layers</th><th>Status</th></tr></thead><tbody>${s.map(o=>`<tr><td>${o.id}</td><td>${o.time}</td><td>${esc(o.channel)}</td><td>${o.symbol}</td><td>${o.side}</td><td>${o.type}</td><td>${o.legs}</td><td><span class="eq-chip ${o.status==='TRIGGERED'?'triggered':o.status==='PENDING'?'pending':'expired'}">${o.status}</span></td></tr>`).join('')}</tbody></table></div></section>`}
function eqSuggestRisk(keepPage=false){const capital=Number($('eqCapital')?.value??eqRisk.capital);if(!Number.isFinite(capital)||capital<=0||capital>1e9){toast('Enter a valid capital between $1 and $1,000,000,000');return}eqRisk={...eqRisk,capital:Math.round(capital*100)/100,target:Math.round(capital*.005*100)/100,loss:Math.round(capital*.01*100)/100};eqSaveRisk();if(state.view==='Smart Risk' || keepPage){go('Smart Risk')}else render();toast('Illustrative suggestion: daily goal 0.5% and loss ceiling 1% of capital')}
function eqSaveRiskForm(){const values=['capital','target','loss'].map(id=>Number($(`eq${id[0].toUpperCase()+id.slice(1)}`).value));if(values.some(x=>!Number.isFinite(x)||x<=0)||values[0]>1e9||values[1]>1e8||values[2]>1e8){toast('Please enter positive finite amounts within range');return}eqRisk={capital:Math.round(values[0]*100)/100,target:Math.round(values[1]*100)/100,loss:Math.round(values[2]*100)/100};eqSaveRisk();render();toast('Saved locally in this browser — not enforced by MT5')}
function eqRiskPage(){const todaySum=eqSummary(eqFilteredTrades('TODAY')),gain=eqRisk.target?100*todaySum.pnl/eqRisk.target:0,remaining=eqRisk.loss+todaySum.pnl;return head('Smart Profit & Risk','Edit capital, a daily profit goal and a daily loss ceiling; suggestions are examples, not guaranteed results.')+notice()+`<div class="eq-grid3">${eqKpi('Trading Capital',eqMoney(eqRisk.capital),'User-editable simulated capital','', '◈')}${eqKpi('Daily Profit Target',eqMoney(eqRisk.target),`${(100*eqRisk.target/eqRisk.capital).toFixed(2)}% of capital`,'green','↗')}${eqKpi('Daily Loss Limit',eqMoney(eqRisk.loss),`${(100*eqRisk.loss/eqRisk.capital).toFixed(2)}% of capital`,'red','⌑')}</div><div class="eq-grid2"><section class="panel"><div class="eq-subhead"><h2>Personal Risk Planning</h2><span class="eq-updated">Stored on this device</span></div><p class="eq-muted">Enter your capital, then get example amounts. You can freely replace both recommendations.</p><div class="eq-fields"><label class="eq-field">Capital (USD)<input id="eqCapital" type="number" min="1" max="1000000000" step="0.01" value="${Number(eqRisk.capital)}"></label><label class="eq-field">Daily Target (USD)<input id="eqTarget" type="number" min="0.01" step="0.01" value="${Number(eqRisk.target)}"></label><label class="eq-field">Daily Loss Limit (USD)<input id="eqLoss" type="number" min="0.01" step="0.01" value="${Number(eqRisk.loss)}"></label></div><div class="eq-buttons"><button class="eq-btn" onclick="eqSuggestRisk()">✦ Auto Suggest</button><button class="eq-btn primary" onclick="eqSaveRiskForm()">Save Risk Plan</button></div><p class="eq-tagline" style="margin-top:12px">Suggested starting example: target 0.5%, loss limit 1.0% of entered capital. These are configurable visual defaults, not financial advice, not an expected return and not an actual trading limit.</p></section><section class="panel"><h2>Today's Target Tracker</h2><div class="eq-row"><span>Realized trade P&L</span><b class="${todaySum.pnl>=0?'green':'red'}">${eqFmtMoney(todaySum.pnl)}</b></div><div class="eq-row"><span>Target progress</span><b>${Math.min(100,Math.max(0,gain)).toFixed(1)}%</b></div><div class="eq-track"><span style="width:${Math.min(100,Math.max(0,gain))}%"></span></div><div class="eq-row"><span>Remaining loss capacity if today were negative</span><b>${eqMoney(Math.max(0,remaining))}</b></div><div class="eq-track loss"><span style="width:${Math.min(100,Math.max(0,-100*todaySum.pnl/eqRisk.loss))}%"></span></div><div class="eq-row"><span>Current Auto BE toggle</span><span class="eq-chip">${state.be?'ON (UI preview)':'OFF'}</span></div><p class="eq-tagline">No server-side or broker-side daily loss enforcement exists in this public demo.</p></section></div><section class="panel"><div class="eq-subhead"><h2>Risk & Execution Rules</h2><button class="eq-btn alt" onclick="go('Risk Manager')">Original advanced controls ↗</button></div><p class="eq-muted">Receiver dashboard shows configurable risk preferences. The actual trading backend must enforce balances, drawdown calculations, per-broker P&L aggregation, server-time cutoffs and emergency locks before users can rely on these limits.</p></section>`}
function eqJournalRows(){let a=eqTrades.filter(t=>eqJournalState.day?t.date===eqJournalState.day:eqIsInPeriod(t.date,eqJournalState.period));if(eqJournalState.result!=='ALL')a=a.filter(t=>t.result===eqJournalState.result);if(eqJournalState.channel!=='ALL')a=a.filter(t=>t.channel===eqJournalState.channel);if(eqJournalState.search){const v=eqJournalState.search.trim().toLowerCase();a=a.filter(t=>[t.id,t.ticket,t.symbol,t.channel,t.broker,t.side,t.result,eqNotes[t.id]||''].some(x=>String(x).toLowerCase().includes(v)))}return a}
function eqSetJournalFilter(field,value){eqJournalState[field]=value;eqUpdateJournalTable()}
function eqJournal(){const x=eqJournalRows(),s=eqSummary(x);return head('Professional Trade Journal','Search and annotate trades. Generate branded PDF and true .xlsx workbooks from the selected records.')+notice()+`<div class="eq-report-banner"><div><strong>EDGEQUANT · Performance Report Studio</strong><p>Filtered trade journal · channel breakdown · daily performance · outcome summary · risk plan</p></div><div class="eq-buttons"><button class="eq-btn primary" onclick="eqExportXlsx()">↓ Export Excel (.xlsx)</button><button class="eq-btn" onclick="eqExportPdf()">↓ Export PDF (.pdf)</button></div></div><section class="panel"><div class="eq-filters"><label>Period<select id="eqJPeriod" class="eq-filter" onchange="eqJournalState.period=this.value;eqJournalState.day='';render()">${[['TODAY','Today'],['WEEK','This Week'],['MONTH','This Month'],['ALL','All Time']].map(([v,l])=>`<option value="${v}" ${eqJournalState.period===v?'selected':''}>${l}</option>`).join('')}</select></label><label>Exit Result<select class="eq-filter" onchange="eqSetJournalFilter('result',this.value)">${['ALL','TP','SL','BE','MANUAL'].map(k=>`<option value="${k}" ${eqJournalState.result===k?'selected':''}>${k==='ALL'?'All Results':k==='MANUAL'?'Manual Close':k}</option>`).join('')}</select></label><label>Signal Channel<select class="eq-filter" onchange="eqSetJournalFilter('channel',this.value)">${['ALL',...eqChannels].map(k=>`<option value="${k}" ${eqJournalState.channel===k?'selected':''}>${k==='ALL'?'All Channels':k}</option>`).join('')}</select></label><label>Search ticket / symbol / note<input id="eqJSearch" class="eq-filter" placeholder="Find a trade..." value="${esc(eqJournalState.search)}" oninput="eqSetJournalFilter('search',this.value)"></label>${eqJournalState.day?`<button class="eq-btn alt" onclick="eqJournalState.day='';render()">Day ${eqJournalState.day} ×</button>`:''}</div><div id="eqJournalStats">${eqJournalStats(s)}</div><div class="eq-table-scroll" id="eqJournalTable">${eqJournalTable(x)}</div><p class="eq-tagline" style="margin-top:13px">Notes stay in this browser (local storage). Exported report is generated entirely in your browser. This is an illustrative trade ledger, not MT5 history.</p></section>`}
function eqJournalStats(s){return `<div class="eq-statsstrip"><div class="eq-strip"><small>Closed trade legs</small><b>${s.total}</b></div><div class="eq-strip"><small>Net realized P&L</small><b class="${s.pnl>=0?'green':'red'}">${eqFmtMoney(s.pnl)}</b></div><div class="eq-strip"><small>TP / SL</small><b>${s.tp} / ${s.sl}</b></div><div class="eq-strip"><small>BE / Manual</small><b>${s.be} / ${s.manual}</b></div></div>`}
function eqJournalTable(a){if(!a.length)return '<div class="eq-empty">No trades match your filters. Change the period, channel or result.</div>';return `<table class="eq-table"><thead><tr><th>Date / Time</th><th>Ticket</th><th>Symbol</th><th>Side</th><th>Channel</th><th>Lot</th><th>Exit</th><th>Realized P&L</th><th>Journal Note</th></tr></thead><tbody>${a.slice(0,120).map(t=>`<tr><td>${t.date}<br>${t.time}</td><td>${t.id}</td><td>${t.symbol}</td><td><span class="eq-chip">${t.side}</span></td><td>${esc(t.channel)}</td><td>${t.lot.toFixed(2)}</td><td><span class="eq-chip ${t.result==='SL'?'expired':t.result==='TP'?'triggered':t.result==='MANUAL'?'pending':''}">${t.result==='MANUAL'?'MANUAL CLOSE':t.result}</span></td><td class="${t.pnl>=0?'green':'red'}">${eqFmtMoney(t.pnl)}</td><td><button class="eq-btn alt" onclick="eqEditNote('${t.id}')">${eqNotes[t.id]?'Edit note ✎':'Add note +'}</button></td></tr>`).join('')}</tbody></table>${a.length>120?`<p class="eq-muted">Showing 120 of ${a.length} entries. All filtered entries are included in PDF/Excel exports.</p>`:''}`}
function eqUpdateJournalTable(){if($('eqJournalStats'))$('eqJournalStats').innerHTML=eqJournalStats(eqSummary(eqJournalRows()));if($('eqJournalTable'))$('eqJournalTable').innerHTML=eqJournalTable(eqJournalRows())}
function eqEditNote(id){const t=eqTrades.find(x=>x.id===id);if(!t)return;openModal('Trade Journal Note',`<p><b>${esc(t.id)}</b> · ${esc(t.channel)} · ${eqFmtMoney(t.pnl)}</p><label class="eq-field">Your trading notes / lessons<textarea id="eqNoteText" style="background:#0b2a3c;border:1px solid #24546c;border-radius:8px;color:white;padding:10px;width:100%;min-height:105px;resize:vertical;">${esc(eqNotes[id]||'')}</textarea></label><div class="eq-buttons" style="margin-top:14px"><button class="eq-btn primary" onclick="eqSaveNote('${id}')">Save Note</button><button class="eq-btn alt" onclick="closeModal()">Cancel</button></div>`)}
function eqSaveNote(id){const v=($('eqNoteText')?.value||'').slice(0,1500);eqNotes[id]=v;try{localStorage.setItem('edgequant-v2-notes',JSON.stringify(eqNotes))}catch(_){}closeModal();if(state.view==='Trade Journal')eqUpdateJournalTable();toast('Journal note saved in this browser')}
